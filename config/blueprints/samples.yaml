blueprints:
  - name: docker
    template: base
    description: Workspace with the Docker CLI, backed by the workspace's Podman socket.
    image: docker.io/docker:24-cli

    env:
      DOCKER_HOST: "unix:///var/run/podman/podman.sock"

    podman:
      enabled: true
      createDockerSockSymlink: false

  - name: ubuntu
    template: base
    description: Plain Ubuntu workspace.
    image: docker.io/ubuntu:latest

  - name: alpine
    template: base
    description: Plain Alpine Linux workspace.
    image: docker.io/alpine:latest
