{{- $podman := .Values.podman | default dict -}}
{{- /* requests derived from resources.overcommit; empty when no ratio is set */ -}}
{{- $rr := .Values.resourceRequests | default dict -}}
{{- $mainRR := $rr.main | default dict -}}
{{- $podmanRR := $rr.podman | default dict -}}
{{- $defaultSecurityContext := dict "runAsUser" 0 "runAsGroup" 0 -}}
{{- $securityContext := merge (dict) (.Values.securityContext | default dict) $defaultSecurityContext -}}
{{- $releaseName := .Release.Name }}
{{- $si := $podman.storageImage | default dict -}}
{{- $siBlock := eq ($si.mode | default "") "block" -}}
{{- $siStorage := $si.storage | default "graphdb" -}}
{{- $siMount := $si.mountPath | default "/var/lib/containers/storage" -}}
{{- $siEnabled := and ($podman.enabled | default false) $si.mode -}}
{{- /* storages the init-base container chowns: a raw block device cannot be */ -}}
{{- $chownPodmanStorages := $podman.storages | default dict -}}
{{- if and $siEnabled $siBlock }}{{- $chownPodmanStorages = omit $chownPodmanStorages $siStorage -}}{{- end -}}

apiVersion: v1
kind: Pod
metadata:
  name: {{ .Release.Name }}
  namespace: {{ .Release.Namespace }}
  annotations:
    k8shell.io/manifest-hash: {{ .Values.__manifesthash__ | quote }}
    {{- if .Values.__identity__ }}
    k8shell.io/identity: {{ .Values.__identity__ | quote }}
    {{- end }}
    k8shell.io/userstr: {{ .Values.__userstr__ | quote }}
    {{- if and .Values.network (or .Values.network.allowEgressToCIDRs .Values.network.allowEgressToPods) }}
    k8shell.io/egress-rules: {{ dict "allowEgressToCIDRs" (.Values.network.allowEgressToCIDRs | default list) "allowEgressToPods" (.Values.network.allowEgressToPods | default list) | toJson | quote }}
    {{- end }}
    {{- if and .Values.network .Values.network.webProxy }}
    k8shell.io/web-proxy-port: {{ .Values.network.webProxy.port | quote }}
    k8shell.io/web-proxy-roles: {{ .Values.network.webProxy.allowedRoles | default list | toJson | quote }}
    {{- end }}
    {{- if .Values.__webproxyaliasmessage__ }}
    k8shell.io/web-proxy-alias-message: {{ .Values.__webproxyaliasmessage__ | quote }}
    {{- end }}
  labels:
    {{- include "workspace.workspaceLabels" . | nindent 4 }} 
spec:
  {{- if .Values.runtimeClassName }}
  runtimeClassName: {{ .Values.runtimeClassName }}
  {{- end }}
  {{ if .Values.__registry__.regcred }}
  imagePullSecrets:
  - name: {{ .Values.__registry__.regcred }}
  {{ end }}  
  restartPolicy: OnFailure
  {{- if and .Values.subdomain .Values.hostname }}
  hostname: {{ .Values.hostname }}
  subdomain: {{ .Values.subdomain }}
  {{- end }}

  initContainers:
    #### init container to initialize the workspace
    - name: init-base
      image: {{ include "workspace.k8shelldImage" . }}
      imagePullPolicy: {{ .Values.k8shelld.imagePullPolicy }}
      # On non-zero exit with an empty /dev/termination-log, the kubelet copies the
      # tail of the container log into state.terminated.message, which the
      # provisioner surfaces as lastFailMessage.
      terminationMessagePolicy: FallbackToLogsOnError
      {{- if .Values.runtimeClassName }}
      {{- include "workspace.vmInitResources" . | nindent 6 }}
      {{- end }}
      securityContext:
        runAsUser: 0
        runAsGroup: 0
      command:
        - /bin/sh
        - -c
        - |
          /k8shell/dist/scripts/init-base
          {{- include "workspace.storage.chownCommands" (dict "storages" .Values.storages "user" .Values.__user__) | nindent 10 }}
          {{- if ($podman.enabled | default false) }}
          {{- include "workspace.storage.chownCommands" (dict "storages" $chownPodmanStorages "user" .Values.__user__) | nindent 10 }}
          {{- end }}
      volumeMounts:
        - name: bin-volume
          mountPath: /usr/local/bin
        {{- include "workspace.storage.chownVolumeMounts" (dict "storages" .Values.storages "prefix" "" "user" .Values.__user__) | nindent 8 }}
        {{- if ($podman.enabled | default false) }}
        {{- include "workspace.storage.chownVolumeMounts" (dict "storages" $chownPodmanStorages "prefix" "podman-" "user" .Values.__user__) | nindent 8 }}
        {{- end }}

    {{- if $siEnabled }}
    #### init container that prepares the podman storage image (file) or device (block)
    - name: init-podman-disk
      image: {{ include "workspace.imageWithRegistry" (dict "image" (required "podman.storageImage.initImage is required" $si.initImage) "registry" .Values.__registry__.host) }}
      imagePullPolicy: {{ .Values.k8shelld.imagePullPolicy }}
      terminationMessagePolicy: FallbackToLogsOnError
      {{- if .Values.runtimeClassName }}
      {{- include "workspace.vmInitResources" . | nindent 6 }}
      {{- end }}
      securityContext:
        runAsUser: 0
        runAsGroup: 0
      command:
        - /bin/sh
        - -c
        - |
          set -e
          {{- if $siBlock }}
          dev={{ required "podman.storageImage.diskPath is required for mode block" $si.diskPath }}
          blkid $dev >/dev/null 2>&1 || mkfs.ext4 -q $dev
          {{- else }}
          img={{ required "podman.storageImage.diskPath is required for mode file" $si.diskPath }}/storage.img
          [ -f $img ] && exit 0
          # build under a temporary name so an interrupted run is never mistaken for a formatted image
          rm -f $img.tmp
          truncate -s {{ required "podman.storageImage.size is required for mode file" $si.size }} $img.tmp
          mkfs.ext4 -q -F $img.tmp
          mv $img.tmp $img
          {{- end }}
      {{- if $siBlock }}
      volumeDevices:
        - name: storage-podman-{{ $siStorage }}
          devicePath: {{ $si.diskPath }}
      {{- else }}
      volumeMounts:
        - name: storage-podman-{{ $siStorage }}
          mountPath: {{ $si.diskPath }}
      {{- end }}
    {{- end }}

    {{- range $ic := ($podman.initContainers | default list) }}
    {{- if $podman.enabled }}
    - name: {{ $ic.name }}
      image: {{ include "workspace.imageWithRegistry" (dict "image" $ic.image "registry" $.Values.__registry__.host) }}
      imagePullPolicy: {{ $.Values.k8shelld.imagePullPolicy }}
      terminationMessagePolicy: FallbackToLogsOnError
      {{- if $.Values.runtimeClassName }}
      {{- include "workspace.vmInitResources" $ | nindent 6 }}
      {{- end }}
      securityContext:
        runAsUser: 0
        runAsGroup: 0
      command:
        {{- toYaml $ic.command | nindent 8 }}
      {{- if $ic.storages }}
      volumeMounts:
        {{- range $sn := $ic.storages }}
        {{- $st := index ($podman.storages | default dict) $sn }}
        - name: storage-podman-{{ $sn }}
          mountPath: {{ (required (printf "podman.initContainers[%s]: unknown storage %s" $ic.name $sn) $st).path }}
        {{- end }}
      {{- end }}
    {{- end }}
    {{- end }}

  containers:
    #### main container
    - name: k8shell-main
      image: {{ include "workspace.mainImage" . }}
      securityContext:
        {{- toYaml $securityContext | nindent 8 }}
      command: ["/usr/local/bin/k8shelld"]
      # On non-zero exit with an empty /dev/termination-log, the kubelet copies the
      # tail of the container log into state.terminated.message, which the
      # provisioner surfaces as lastFailMessage.
      terminationMessagePolicy: FallbackToLogsOnError
      imagePullPolicy: {{ .Values.imagePullPolicy }}
      resizePolicy:
      - resourceName: cpu
        restartPolicy: NotRequired
      - resourceName: memory
        restartPolicy: NotRequired      

      {{- if .Values.resources }}
      resources:
        requests:
          cpu: {{ $mainRR.cpu | default "0.1" | quote }}
          memory: {{ $mainRR.memory | default "128Mi" | quote }}
        limits:
          {{- if .Values.resources.cpu }}
          cpu: {{ .Values.resources.cpu }}
          {{- end }}
          {{- if .Values.resources.memory }}
          memory: {{ .Values.resources.memory }}
          {{- end }}
      {{- end }}

      env:
      - name: IMAGE
        value:  {{ include "workspace.mainImage" . }}
      - name: WORKSPACE
        value: {{ .Release.Name }}
      - name: BLUEPRINT
        value: {{ .Values.__blueprint__ }}
      - name: USERNAME
        value: {{ .Values.__user__.username }}
      - name: USEREMAIL
        value: {{ .Values.__user__.email }}
      - name: K8SHELL_PAT_TOKEN
        valueFrom:
          secretKeyRef:
            name: {{ .Release.Name }}-pat
            key: token
      {{- if .Values.env }}
      {{- range $envName, $envValue := .Values.env }}            
      - name: {{ $envName }}
        value: {{ $envValue | quote }}
      {{- end }}
      {{- end }}
      
      volumeMounts:
      - name: bin-volume
        mountPath: /usr/local/bin/k8shelld
        subPath: k8shelld
        readOnly: true
      - name: bin-volume
        mountPath: /usr/local/bin/kbox
        subPath: kbox
        readOnly: true
      - name: bin-volume
        mountPath: /usr/local/bin/sftp
        subPath: sftp
        readOnly: true
      - name: config-volume
        mountPath: /etc/k8shell
        readOnly: true
      - name: main-volume
        mountPath: /usr/local/k8shell/system
        readOnly: true
      - name: pat-secret
        mountPath: /var/run/secrets/k8shell-pat
        readOnly: true
      {{- if .Values.storages }}
      {{- range $storageName, $storage := .Values.storages }}
      {{- if and $storage (kindIs "map" $storage) ($storage.enabled | default false) }}
      - name: storage-{{ $storageName }}
        mountPath: {{ $storage.path }}
        readOnly: {{ $storage.readonly | default false }}
      {{- end }}
      {{- end }}
      {{- end }}
      {{- if .Values.extFiles }}
      {{- range $path, $content := .Values.extFiles }}
      - name: main-ext-files-volume
        mountPath: {{ $path }}
        subPath: {{ $path | replace "/" "__" }}
      {{- end }}
      {{- end }}
      {{- if ($podman.enabled | default false) }}
      - name: podman-sock
        mountPath: /var/run/podman
        # readOnly: true
      {{- end }}
      {{- if .Values.__certmanager__.enabled }}
      - name: {{ .Release.Name }}-cert
        mountPath: /etc/tls/k8shelld
        readOnly: true
      {{- end }}


    #### podman engine container
    {{- if ($podman.enabled | default false) }}
    - name: k8shell-podman
      image: {{ $podman.image }}
      {{- if .Values.runtimeClassName }}
      # Only for VM runtimes: the kubelet sets the pod cgroup memory limit (which bounds
      # the VM guest RAM on the host) only when every container has a memory limit.
      # Note the sidecar limit also counts into the VM size.
      resources:
        requests:
          cpu: {{ $podmanRR.cpu | default "10m" | quote }}
          memory: {{ $podmanRR.memory | default "128Mi" | quote }}
        limits:
          cpu: {{ ($podman.resources).cpu | default "1" | quote }}
          memory: {{ ($podman.resources).memory | default "2Gi" | quote }}
      {{- end }}
      # command: ["/bin/sh"]
      # args:
      # - -c
      # - |
      #   trap '' TERM INT
      #   while true; do
      #     sleep 86400
      #   done

      # Run under catatonit (shipped with podman) as PID 1. podman itself does not
      # reap orphaned conmon/runtime children reparented to PID 1, so without an
      # init every `podman run`/`exec` leaves zombies behind on the node.
      {{- if or $podman.startupScript $siEnabled $podman.cacheTrimSeconds }}
      # A startup script and/or the storage image mount run first, as root.
      command:
      - /bin/sh
      - -c
      args:
      - |
        set -e
        {{- if $podman.startupScript }}
        {{- $podman.startupScript | nindent 8 }}
        {{- end }}
        {{- if $siEnabled }}
        mkdir -p {{ $siMount }}
        {{- if $siBlock }}
        mount {{ $si.diskPath }} {{ $siMount }}
        {{- else }}
        # Attach the image with direct I/O, so its data isn't cached twice in the
        # guest (by the loop device and by the backing file), and reuse the device
        # when the container restarts.
        img={{ $si.diskPath }}/storage.img
        dev=$(losetup -j $img -n -O NAME | head -n 1)
        [ -n "$dev" ] || dev=$(losetup -f --show --direct-io=on $img)
        losetup --direct-io=on $dev
        mount $dev {{ $siMount }}
        {{- end }}
        {{- end }}
        {{- /* Only for a VM-based runtime class: in a plain container the privileged
               write to /proc/sys/vm would drop the node's page cache. */}}
        {{- if and .Values.runtimeClassName $podman.cacheTrimSeconds }}
        # return cold guest page cache to the host
        ( while true; do sleep {{ $podman.cacheTrimSeconds | int }}; echo 1 > /proc/sys/vm/drop_caches; done ) &
        {{- end }}
        exec /usr/libexec/podman/catatonit -- podman system service --time=0 unix:///var/run/podman/podman.sock
      {{- else }}
      command:
      - /usr/libexec/podman/catatonit
      - --
      - podman
      args:
      - system
      - service
      - --time=0
      - unix:///var/run/podman/podman.sock
      {{- end }}
      # On non-zero exit with an empty /dev/termination-log, the kubelet copies the
      # tail of the container log into state.terminated.message, which the
      # provisioner surfaces as lastFailMessage.
      terminationMessagePolicy: FallbackToLogsOnError
        
      # see https://docs.k8shell.io/concepts/overview/security#least-privileged-workspace-containers
      {{- if $podman.securityContext }}
      securityContext:
        {{- toYaml $podman.securityContext | nindent 8 }}
      {{- end }}

      volumeMounts:
        - name: podman-sock
          mountPath: /var/run/podman
      {{- if .Values.__registry__.certCA }}
        - name: podman-ca-cert
          mountPath: /etc/ssl/certs/registry-ca.pem
          subPath: registry-ca.pem
      {{- end }}

      {{- if and ($podman.parentStorages | default false) .Values.storages }}    
      {{- range $storageName, $storage := .Values.storages }}
      {{- if and $storage (kindIs "map" $storage) ($storage.enabled | default false) }}
        - name: storage-{{ $storageName }}
          mountPath: {{ $storage.path }}
          readOnly: {{ $storage.readonly | default false }}
      {{- end }}
      {{- end }}
      {{- end }}
      {{- if $podman.storages }}
      {{- range $storageName, $storage := $podman.storages }}
      {{- if and $storage (kindIs "map" $storage) ($storage.enabled | default false) (not (and $siEnabled $siBlock (eq $storageName $siStorage))) }}
        - name: storage-podman-{{ $storageName }}
          mountPath: {{ $storage.path }}
          readOnly: {{ $storage.readonly | default false }}
      {{- end }}
      {{- end }}
      {{- end }}
      {{- if $podman.extFiles }}
      {{- range $path, $content := $podman.extFiles }}
        - name: podman-ext-files-volume
          mountPath: {{ $path }}
          subPath: {{ $path | replace "/" "__" }}
      {{- end }}
      {{- end }}
      {{- if and $siEnabled $siBlock }}
      volumeDevices:
        - name: storage-podman-{{ $siStorage }}
          devicePath: {{ $si.diskPath }}
      {{- end }}
    {{- end }}

  ####  list of volumes to mount into the containers
  volumes:
  - name: bin-volume
    emptyDir: {}
  - name: config-volume
    configMap:
      name: {{ .Release.Name }}-k8shelld-config
      items:
      - key: config.yaml
        path: config.yaml
      - key: blueprint.yaml
        path: blueprint.yaml
      - key: profile.yaml
        path: profile.yaml
  - name: main-volume
    configMap:
      name: {{ .Release.Name }}-files
      defaultMode: 0755
      items:
      - key: README
        path: README
        {{- range $script := .Values.initScripts }}
      - key: {{ $script.__file }}
        path: {{ $script.__file }}
        {{- end }}
  - name: pat-secret
    secret:
      secretName: {{ .Release.Name }}-pat
  {{- if .Values.storages }}
  {{- range $storageName, $storage := .Values.storages }}
  {{- if and $storage (kindIs "map" $storage) ($storage.enabled | default false) }}
  - name: storage-{{ $storageName }}
    {{- if eq ($storage.type | default "local") "memory" }}
    emptyDir:
      medium: Memory
      {{- if $storage.sizeLimit }}
      sizeLimit: {{ $storage.sizeLimit }}
      {{- end }}
    {{- else if eq ($storage.type | default "local") "emptyDir" }}
    {{- if $storage.sizeLimit }}
    emptyDir:
      sizeLimit: {{ $storage.sizeLimit }}
    {{- else }}
    emptyDir: {}
    {{- end }}
    {{- else if eq ($storage.type | default "local") "shared" }}
    persistentVolumeClaim:
      claimName: pvc-{{ $storageName }}{{- if $storage.id }}-{{ $storage.id }}{{- end }}
    {{- else }}
    persistentVolumeClaim:
      claimName: pvc-{{ $releaseName }}-{{ $storageName }}
    {{- end }}
  {{- end }}
  {{- end }}
  {{- end }}
  {{- if and ($podman.enabled | default false) $podman.storages }}
  {{- range $storageName, $storage := $podman.storages }}
  {{- if and $storage (kindIs "map" $storage) ($storage.enabled | default false) }}
  - name: storage-podman-{{ $storageName }}
    {{- if eq ($storage.type | default "local") "memory" }}
    emptyDir:
      medium: Memory
      {{- if $storage.sizeLimit }}
      sizeLimit: {{ $storage.sizeLimit }}
      {{- end }}
    {{- else if eq ($storage.type | default "local") "emptyDir" }}
    {{- if $storage.sizeLimit }}
    emptyDir:
      sizeLimit: {{ $storage.sizeLimit }}
    {{- else }}
    emptyDir: {}
    {{- end }}
    {{- else }}
    persistentVolumeClaim:
      claimName: pvc-{{ $releaseName }}-podman-{{ $storageName }}
    {{- end }}
  {{- end }}
  {{- end }}
  {{- end }}
  {{- if .Values.extFiles }}
  - name: main-ext-files-volume
    configMap:
      name: {{ $releaseName }}-main-ext-files
      items:
        {{- range $path, $content := .Values.extFiles }}
        - key: {{ $path | replace "/" "__" | quote }}
          path: {{ $path | replace "/" "__" }}
        {{- end }}
  {{- end }}
  {{- if ($podman.enabled | default false) }}
  - name: podman-sock
    {{- if $podman.socketMedium }}
    emptyDir:
      medium: {{ $podman.socketMedium }}
    {{- else }}
    emptyDir: {}
    {{- end }}
  {{- if $podman.extFiles }}
  - name: podman-ext-files-volume
    configMap:
      name: {{ $releaseName }}-podman-ext-files
      items:
        {{- range $path, $content := $podman.extFiles }}
        - key: {{ $path | replace "/" "__" | quote }}
          path: {{ $path | replace "/" "__" }}
        {{- end }}
  {{- end }}
  {{- end }}
  {{- if .Values.__registry__.certCA }}
  - name: podman-ca-cert
    configMap:
      name: registryca
      items:
        - key: registry-ca.pem
          path: registry-ca.pem
  {{- end }}
  {{- if .Values.__certmanager__.enabled }}
  - name: {{ .Release.Name }}-cert
    secret:
      secretName: {{ .Release.Name }}-tls
  {{- end }}

  {{- if .Values.affinity }}
  affinity:
    nodeAffinity:
      requiredDuringSchedulingIgnoredDuringExecution:
        nodeSelectorTerms:
        - matchExpressions:
          - key: kubernetes.io/hostname
            operator: In
            values:
            {{- toYaml .Values.affinity | nindent 12 }}
  {{- end }}

  enableServiceLinks: false
